<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ceres AI</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" rel="stylesheet">
  <style>
    :root {
      --bg:#faf9f5; --bg-side:#f5f4ee; --surface:#ffffff;
      --border:#e5e2d9; --border-soft:#efece4;
      --chip:#f0eee6; --chip-hover:#e8e5da;
      --text:#1f1e1d; --text-soft:#3d3b37; --text-muted:#83817a;
      --accent:#c96442; --accent-hover:#b25636; --accent-soft:#f6ede8;
      --danger:#b4433a; --verify:#4a7c59; --premium:#7c6da8;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai',Tahoma,sans-serif;
      background:var(--bg); color:var(--text); height:100vh; height:100dvh;
      display:flex; overflow:hidden; font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
    }
    .app { display:flex; width:100%; height:100%; position:relative; }

    /* ═══ SIDEBAR ═══ */
    .backdrop { position:fixed; inset:0; background:rgba(31,30,29,.3); z-index:40; display:none; }
    .backdrop.open { display:block; }
    .sidebar { width:258px; background:var(--bg-side); border-right:1px solid var(--border);
      display:flex; flex-direction:column; flex-shrink:0; z-index:50; transition:transform .22s ease; }
    .side-head { padding:14px 14px 10px; display:flex; align-items:center; gap:9px; }
    .side-head .name { font-weight:600; font-size:15px; letter-spacing:-.01em; }
    .btn-new { margin:0 12px 14px; background:transparent; color:var(--accent); border:none;
      padding:8px 10px; border-radius:9px; cursor:pointer; font-weight:600; font-size:14px;
      display:flex; align-items:center; gap:9px; font-family:inherit; transition:background .15s; }
    .btn-new:hover { background:var(--accent-soft); }
    .side-search { margin:0 12px 8px; position:relative; }
    .side-search input { width:100%; background:transparent; border:1px solid transparent; color:var(--text);
      font-size:13.5px; padding:7px 8px 7px 28px; border-radius:8px; outline:none; font-family:inherit; }
    .side-search input:focus { border-color:var(--border); background:var(--surface); }
    .side-search i { position:absolute; left:9px; top:10px; color:var(--text-muted); font-size:11.5px; }
    .side-label { font-size:11.5px; color:var(--text-muted); padding:6px 20px 4px; font-weight:500; }
    .chat-list { flex:1; overflow-y:auto; padding:0 8px 8px; }
    .chat-item { padding:7px 11px; font-size:13.5px; color:var(--text-soft); border-radius:8px;
      cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:1px; }
    .chat-item:hover { background:#eceade; }
    .chat-item.active { background:#e8e5d8; font-weight:500; }
    .chat-item .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
    .chat-item .del { color:var(--text-muted); opacity:0; font-size:11px; padding:3px 4px; border-radius:5px; }
    .chat-item:hover .del { opacity:1; }
    .chat-item .del:hover { color:var(--danger); background:rgba(180,67,58,.09); }
    .side-foot { padding:8px 12px 12px; border-top:1px solid var(--border); }
    .side-btn { width:100%; background:none; border:none; color:var(--text-muted); padding:7px 9px;
      border-radius:8px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:9px;
      font-family:inherit; text-align:left; }
    .side-btn:hover { background:#eceade; color:var(--text); }
    .side-btn.danger:hover { color:var(--danger); }

    /* ═══ MAIN ═══ */
    .main { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
    .topbar { height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; flex-shrink:0; }
    .btn-icon { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px;
      width:32px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center; }
    .btn-icon:hover { background:#eceade; color:var(--text); }
    .btn-burger { display:none; }
    .topbar-title { font-size:14.5px; font-weight:500; color:var(--text-soft); flex:1;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conn { font-size:11.5px; padding:3px 9px; border-radius:20px; display:flex; align-items:center;
      gap:5px; font-weight:500; white-space:nowrap; border:1px solid transparent; }
    .conn.loading { background:#fbf5e8; color:#8a6d2f; border-color:#eadcbd; }
    .conn.ready { background:#eef4ef; color:var(--verify); border-color:#d4e3d8; }
    .conn.error { background:#fbeeed; color:var(--danger); border-color:#f0d5d2; }
    .conn .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

    /* ═══ CHAT ═══ */
    .scroll { flex:1; overflow-y:auto; }
    .thread { max-width:748px; margin:0 auto; padding:8px 24px 20px; display:flex; flex-direction:column; gap:22px; }
    .row { display:flex; flex-direction:column; }
    .row.user { align-items:flex-end; }
    .bubble-user { background:var(--chip); padding:11px 16px; border-radius:16px; font-size:15px;
      line-height:1.6; max-width:85%; white-space:pre-wrap; word-break:break-word; }

    .msg-ai { font-size:15.5px; line-height:1.72; color:var(--text); word-break:break-word; }
    .msg-ai > *:first-child { margin-top:0; }
    .msg-ai > *:last-child { margin-bottom:0; }
    .msg-ai p { margin:0 0 14px; }
    .msg-ai ul, .msg-ai ol { margin:0 0 14px; padding-left:24px; }
    .msg-ai li { margin-bottom:5px; }
    .msg-ai h1,.msg-ai h2,.msg-ai h3 { margin:22px 0 10px; font-weight:600; letter-spacing:-.01em; line-height:1.35; }
    .msg-ai h1 { font-size:21px; } .msg-ai h2 { font-size:18.5px; } .msg-ai h3 { font-size:16.5px; }
    .msg-ai strong { font-weight:600; }
    .msg-ai code { background:#efece2; padding:1.5px 5px; border-radius:4px; font-size:13.5px;
      font-family:ui-monospace,'SF Mono',Menlo,monospace; }
    .msg-ai pre { background:#f6f4ec; border:1px solid var(--border-soft); border-radius:10px;
      padding:14px 16px; overflow-x:auto; margin:0 0 14px; }
    .msg-ai pre code { background:none; padding:0; font-size:13px; line-height:1.6; }
    .msg-ai table { border-collapse:collapse; margin:0 0 14px; width:100%; font-size:14px; }
    .msg-ai th, .msg-ai td { border:1px solid var(--border); padding:7px 11px; text-align:left; }
    .msg-ai th { background:#f3f1e8; font-weight:600; }
    .msg-ai blockquote { border-left:2.5px solid var(--border); padding-left:14px; color:var(--text-muted); margin:0 0 14px; }
    .msg-ai a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
    .msg-ai hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
    .cursor { display:inline-block; width:2px; height:16px; background:var(--accent);
      margin-left:2px; vertical-align:-2px; animation:blink .9s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }

    /* ═══ LOGO ═══ */
    .logo { width:26px; height:26px; flex-shrink:0; overflow:visible; }
    .logo.sm { width:19px; height:19px; }
    .lo-out { transform-origin:24px 24px; animation:spin 16s linear infinite; }
    .lo-in { transform-origin:24px 24px; animation:spinr 11s linear infinite; }
    .lo-core { transform-origin:24px 24px; animation:breathe 4.5s ease-in-out infinite; }
    .lo-moon { transform-origin:24px 24px; animation:spin 7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes spinr { to { transform:rotate(-360deg); } }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    .logo.busy .lo-out { animation-duration:2.4s; }
    .logo.busy .lo-in { animation-duration:1.6s; }
    .logo.busy .lo-moon { animation-duration:1.2s; }
    .logo.busy .lo-core { animation-duration:1s; }
    @media (prefers-reduced-motion:reduce) { .lo-out,.lo-in,.lo-core,.lo-moon { animation:none!important; } }

    /* ═══ LIVE ═══ */
    .live { display:flex; align-items:center; gap:10px; }
    .live-txt { font-size:14px; color:var(--text-muted); transition:opacity .2s ease; }
    .live-txt.fade { opacity:0; }
    .steps { margin-bottom:12px; display:flex; flex-direction:column; }
    .step { display:flex; align-items:flex-start; gap:9px; font-size:13.5px; color:var(--text-muted);
      padding:3px 0; transition:color .2s; }
    .step .ico { width:15px; flex-shrink:0; text-align:center; margin-top:3px; font-size:11px; }
    .step.done .ico { color:var(--verify); }
    .step.active { color:var(--text-soft); font-weight:500; }
    .step.active .ico { color:var(--accent); }

    .think { border:1px solid var(--border); border-radius:10px; margin-bottom:14px;
      background:#f7f5ed; overflow:hidden; width:fit-content; max-width:100%; }
    .think summary { padding:8px 13px; font-size:13px; color:var(--text-muted); cursor:pointer;
      user-select:none; display:flex; align-items:center; gap:8px; list-style:none; }
    .think summary::-webkit-details-marker { display:none; }
    .think summary:hover { color:var(--text-soft); }
    .think summary .chev { font-size:9px; transition:transform .2s; }
    .think[open] summary .chev { transform:rotate(90deg); }
    .think-body { padding:12px 15px 14px; font-size:13.5px; color:var(--text-soft); line-height:1.68;
      white-space:pre-wrap; border-top:1px solid var(--border-soft); max-width:640px; }
    .think-stage { font-weight:600; color:var(--text); display:block; margin:12px 0 3px; font-size:13px; }
    .think-stage:first-child { margin-top:0; }

    .meta { display:flex; align-items:center; gap:7px; margin-top:11px; flex-wrap:wrap; }
    .act { cursor:pointer; color:var(--text-muted); background:none; border:none; font-size:12.5px;
      display:flex; align-items:center; gap:5px; padding:4px 7px; border-radius:6px; font-family:inherit; }
    .act:hover { color:var(--text); background:#eceade; }
    .tag { display:inline-flex; align-items:center; gap:4px; border-radius:20px; padding:2.5px 9px;
      font-size:11px; font-weight:500; border:1px solid transparent; }
    .tag.src { background:#f2f0e7; color:var(--text-muted); border-color:var(--border-soft); }
    .tag.v-high { background:#eef4ef; color:var(--verify); border-color:#d4e3d8; }
    .tag.v-medium { background:#fbf5e8; color:#8a6d2f; border-color:#eadcbd; }
    .tag.v-low { background:#fbeeed; color:var(--danger); border-color:#f0d5d2; }
    .tag.prem { background:#f2effa; color:var(--premium); border-color:#ddd6ef; }
    .tag.cache { background:#eef4ef; color:var(--verify); border-color:#d4e3d8; }

    .empty { display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:52px 24px 30px; text-align:center; gap:14px; }
    .empty h1 { font-family:Georgia,'Times New Roman',serif; font-size:29px; font-weight:400;
      letter-spacing:-.02em; }
    .empty p { font-size:14.5px; color:var(--text-muted); max-width:410px; }

    /* ═══ COMPOSER ═══ */
    .composer-wrap { padding:0 24px calc(14px + env(safe-area-inset-bottom)); flex-shrink:0; position:relative; }
    .composer {
      max-width:748px; margin:0 auto; background:var(--surface);
      border:1px solid var(--border); border-radius:26px; padding:6px 8px 8px;
      box-shadow:0 2px 10px rgba(31,30,29,.05), 0 1px 2px rgba(31,30,29,.03);
      transition:border-color .15s, box-shadow .15s;
    }
    .composer:focus-within { border-color:#d8d2c4; box-shadow:0 4px 18px rgba(31,30,29,.08); }
    .composer textarea {
      width:100%; background:transparent; border:none; color:var(--text); font-size:16px;
      outline:none; resize:none; max-height:190px; line-height:1.62; padding:12px 12px 6px;
      font-family:inherit;
    }
    .composer textarea::placeholder { color:#a5a294; }

    .bar { display:flex; align-items:center; gap:7px; padding:2px 2px 0; }

    .cbtn {
      width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
      background:var(--chip); color:var(--text-soft); display:flex; align-items:center;
      justify-content:center; font-size:15px; flex-shrink:0; transition:background .15s;
    }
    .cbtn:hover { background:var(--chip-hover); }
    .cbtn.rec { background:#fbeeed; color:var(--danger); animation:pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

    .pill {
      display:inline-flex; align-items:center; gap:7px; background:var(--chip); border:none;
      color:var(--text-soft); border-radius:20px; padding:8px 14px; font-size:14.5px;
      cursor:pointer; font-family:inherit; transition:background .15s; white-space:nowrap;
      max-width:230px; overflow:hidden;
    }
    .pill:hover { background:var(--chip-hover); }
    .pill.deep { background:var(--accent-soft); color:var(--accent); }
    .pill .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pill .cv { font-size:10px; opacity:.6; }

    .spacer { flex:1; }
    .sendbtn {
      width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
      background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
      font-size:14px; flex-shrink:0; transition:background .15s, transform .1s;
    }
    .sendbtn:hover { background:var(--accent-hover); }
    .sendbtn:active { transform:scale(.94); }
    .sendbtn:disabled { background:#ddd9cd; cursor:not-allowed; }

    .hint { max-width:748px; margin:9px auto 0; font-size:11.5px; color:#a5a294;
      text-align:center; user-select:none; }

    /* ═══ POPUP MENU ═══ */
    .pop {
      position:absolute; background:var(--surface); border:1px solid var(--border);
      border-radius:15px; box-shadow:0 10px 34px rgba(31,30,29,.15); padding:6px;
      min-width:250px; max-width:308px; z-index:120; display:none;
      max-height:60vh; overflow-y:auto;
    }
    .pop.open { display:block; }
    .pop-sec { font-size:11px; color:var(--text-muted); padding:8px 12px 5px; font-weight:600;
      letter-spacing:.02em; }
    .pop-item {
      width:100%; background:none; border:none; text-align:left; cursor:pointer;
      padding:9px 12px; border-radius:10px; font-family:inherit; font-size:14px; color:var(--text);
      display:flex; align-items:flex-start; gap:10px; transition:background .12s;
    }
    .pop-item:hover { background:#f5f3eb; }
    .pop-item .pi-ic { width:17px; flex-shrink:0; margin-top:2px; color:var(--text-muted); font-size:13px; }
    .pop-item .pi-tx { flex:1; min-width:0; }
    .pop-item .pi-t { font-weight:500; }
    .pop-item .pi-d { font-size:12px; color:var(--text-muted); line-height:1.45; margin-top:1px; }
    .pop-item .pi-ck { color:var(--accent); font-size:12px; margin-top:3px; opacity:0; }
    .pop-item.sel .pi-ck { opacity:1; }
    .pop-item.sel .pi-ic { color:var(--accent); }
    .pop-div { height:1px; background:var(--border-soft); margin:5px 8px; }

    /* ═══ MODAL ═══ */
    .modal { position:fixed; inset:0; background:rgba(31,30,29,.42); z-index:200;
      display:none; align-items:center; justify-content:center; padding:20px; }
    .modal.open { display:flex; }
    .modal-card { background:var(--surface); border-radius:16px; width:100%; max-width:540px;
      max-height:85vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(31,30,29,.22); }
    .modal-head { padding:16px 20px; border-bottom:1px solid var(--border-soft);
      display:flex; align-items:center; justify-content:space-between; }
    .modal-head h3 { font-size:15.5px; font-weight:600; }
    .modal-body { padding:14px 20px 20px; overflow-y:auto; }
    .tier-h { font-size:12px; font-weight:600; margin:18px 0 3px; display:flex; align-items:center; gap:7px; }
    .tier-h:first-child { margin-top:2px; }
    .tier-h.free { color:var(--verify); } .tier-h.prem { color:var(--premium); }
    .tier-d { font-size:11.5px; color:var(--text-muted); margin-bottom:10px; line-height:1.55; }
    .q-item { padding:9px 0; border-bottom:1px solid var(--border-soft); }
    .q-item:last-child { border-bottom:none; }
    .q-item.off { opacity:.5; }
    .q-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; }
    .q-name { font-size:13.5px; font-weight:500; }
    .q-cnt { font-size:11.5px; color:var(--text-muted); white-space:nowrap; }
    .q-bar { height:4px; background:#f0eee6; border-radius:3px; overflow:hidden; }
    .q-fill { height:100%; background:var(--verify); border-radius:3px; transition:width .4s ease; }
    .q-fill.prem { background:var(--premium); }
    .q-fill.warn { background:#c9924b; } .q-fill.full { background:var(--danger); }
    .q-note { font-size:11px; color:#a5a294; margin-top:4px; line-height:1.5; }
    .q-real { color:var(--verify); font-weight:600; }
    .q-nokey { color:#8a6d2f; font-weight:600; }
    .q-setup { font-size:11px; color:var(--accent); margin-top:4px;
      font-family:ui-monospace,monospace; word-break:break-all; }

    @media (max-width:820px) {
      .sidebar { position:fixed; top:0; left:0; bottom:0; width:80%; max-width:290px;
        transform:translateX(-100%); box-shadow:2px 0 20px rgba(31,30,29,.14); }
      .sidebar.open { transform:translateX(0); }
      .btn-burger { display:flex; }
      .thread { padding:6px 16px 16px; }
      .composer-wrap { padding:0 12px calc(10px + env(safe-area-inset-bottom)); }
      .bubble-user { max-width:90%; }
      .conn span.txt { display:none; }
      .conn { padding:4px 7px; }
      .empty h1 { font-size:24px; }
      .pill { max-width:150px; font-size:14px; padding:8px 12px; }
      .hint { display:none; }
    }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e08a68"/><stop offset="55%" stop-color="#c96442"/><stop offset="100%" stop-color="#8f4229"/>
      </linearGradient>
      <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#d9a892" stop-opacity="0.12"/>
        <stop offset="50%" stop-color="#c96442" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#d9a892" stop-opacity="0.12"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="app">
    <div class="backdrop" id="backdrop" onclick="closeSide()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="side-head"><span id="side-logo"></span><span class="name">Ceres</span></div>
      <button class="btn-new" onclick="newChat()"><i class="fa-solid fa-pen-to-square"></i> แชทใหม่</button>
      <div class="side-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="q" placeholder="ค้นหา" oninput="renderList()">
      </div>
      <div class="side-label">การสนทนา</div>
      <div class="chat-list" id="list"></div>
      <div class="side-foot">
        <button class="side-btn" onclick="openQuota()"><i class="fa-solid fa-database"></i> แหล่งข้อมูลและโควตา</button>
        <button class="side-btn danger" onclick="clearAll()"><i class="fa-regular fa-trash-can"></i> ลบทั้งหมด</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="btn-icon btn-burger" onclick="toggleSide()"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title" id="topbar-title">Ceres</div>
        <div id="conn" class="conn loading"><span class="dot"></span><span class="txt">เชื่อมต่อ</span></div>
      </div>

      <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

      <div class="composer-wrap">
        <!-- POPUP: เลือกโหมด + โมเดล -->
        <div class="pop" id="pop-model">
          <div class="pop-sec">โหมดการตอบ</div>
          <button class="pop-item" id="mode-fast" onclick="setDeep(false)">
            <span class="pi-ic"><i class="fa-solid fa-bolt"></i></span>
            <span class="pi-tx"><span class="pi-t">ตอบทันที</span>
              <span class="pi-d">เร็ว เหมาะกับคำถามทั่วไป</span></span>
            <span class="pi-ck"><i class="fa-solid fa-check"></i></span>
          </button>
          <button class="pop-item" id="mode-deep" onclick="setDeep(true)">
            <span class="pi-ic"><i class="fa-solid fa-lightbulb"></i></span>
            <span class="pi-tx"><span class="pi-t">คิดลึก</span>
              <span class="pi-d">วิเคราะห์โจทย์ → ร่างคำตอบ → ตรวจทาน</span></span>
            <span class="pi-ck"><i class="fa-solid fa-check"></i></span>
          </button>
          <div class="pop-div"></div>
          <div class="pop-sec">โมเดล</div>
          <div id="model-list"></div>
        </div>

        <!-- POPUP: ปุ่ม + -->
        <div class="pop" id="pop-plus">
          <button class="pop-item" onclick="closePops(); newChat();">
            <span class="pi-ic"><i class="fa-solid fa-pen-to-square"></i></span>
            <span class="pi-tx"><span class="pi-t">แชทใหม่</span></span>
          </button>
          <button class="pop-item" onclick="closePops(); openQuota();">
            <span class="pi-ic"><i class="fa-solid fa-database"></i></span>
            <span class="pi-tx"><span class="pi-t">แหล่งข้อมูลและโควตา</span>
              <span class="pi-d">ดูว่าใช้ API ไหนไปเท่าไหร่แล้ว</span></span>
          </button>
          <button class="pop-item" onclick="closePops(); loadModel();">
            <span class="pi-ic"><i class="fa-solid fa-rotate"></i></span>
            <span class="pi-tx"><span class="pi-t">เชื่อมต่อโมเดลใหม่</span></span>
          </button>
        </div>

        <div class="composer">
          <textarea id="input" rows="1" placeholder="ถาม Ceres ได้เลย"
            onkeydown="onKey(event)" oninput="autoGrow(this)"></textarea>
          <div class="bar">
            <button class="cbtn" onclick="togglePop('pop-plus', this)" title="เพิ่มเติม">
              <i class="fa-solid fa-plus"></i></button>
            <button class="pill" id="pill" onclick="togglePop('pop-model', this)">
              <span class="lbl" id="pill-lbl">กำลังเชื่อมต่อ</span>
              <i class="fa-solid fa-chevron-down cv"></i>
            </button>
            <div class="spacer"></div>
            <button class="cbtn" id="mic" onclick="toggleMic()" title="พูดแทนพิมพ์">
              <i class="fa-solid fa-microphone"></i></button>
            <button class="sendbtn" id="send" onclick="send()"><i class="fa-solid fa-arrow-up"></i></button>
          </div>
        </div>
        <div class="hint">Ceres อาจตอบผิดพลาดได้ ควรตรวจสอบข้อมูลสำคัญอีกครั้ง</div>
      </div>
    </main>
  </div>

  <div class="modal" id="quota-modal" onclick="if(event.target===this) closeQuota()">
    <div class="modal-card">
      <div class="modal-head">
        <h3>แหล่งข้อมูลและโควตา</h3>
        <div style="display:flex;gap:2px;">
          <button class="btn-icon" onclick="openQuota()"><i class="fa-solid fa-rotate"></i></button>
          <button class="btn-icon" onclick="closeQuota()"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="modal-body" id="quota-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyjWTQnGyYF-qPn1Ax0G2z_CjebRIqr9DMvz8zQbQsKWjMoPPnqtAabXwXgeiuVRGkF/exec";

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      window.google = window.google || {}; window.google.script = window.google.script || {};
      function mkRunner(ok, fail) {
        return new Proxy({}, { get(t, prop) {
          if (prop === 'withSuccessHandler') return (fn) => mkRunner(fn, fail);
          if (prop === 'withFailureHandler') return (fn) => mkRunner(ok, fn);
          return function(...args) {
            fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
              body: JSON.stringify({ action: prop, args: args }) })
            .then(r => r.json())
            .then(d => { if (d && d.status === 'error') { if (fail) fail(d.error || "เกิดข้อผิดพลาด"); }
                         else { if (ok) ok(d.result !== undefined ? d.result : d); } })
            .catch(e => { console.error(e); if (fail) fail(e); });
          };
        }});
      }
      window.google.script.run = mkRunner();
    }

    function logoSVG(cls) {
      return `<svg class="logo ${cls||''}" viewBox="0 0 48 48">
        <g class="lo-out"><ellipse cx="24" cy="24" rx="21" ry="8" fill="none" stroke="url(#rg)" stroke-width="1.7" transform="rotate(-22 24 24)"/></g>
        <g class="lo-in"><ellipse cx="24" cy="24" rx="17" ry="6" fill="none" stroke="url(#rg)" stroke-width="1.2" opacity="0.6" transform="rotate(38 24 24)"/></g>
        <g class="lo-core">
          <circle cx="24" cy="24" r="9.5" fill="url(#cg)"/>
          <path d="M24 18.6 L24 29.4" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
          <path d="M24 20.6 L21.2 22.6 M24 20.6 L26.8 22.6" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
          <path d="M24 24 L21.2 26 M24 24 L26.8 26" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
        </g>
        <g class="lo-moon"><circle cx="24" cy="4.5" r="2.5" fill="#e08a68"/></g>
      </svg>`;
    }

    let sessions = [], curId = null, model = "", models = [], deepMode = false, busy = false;

    const STEP = { knowledge:'ค้นข้อมูลจากหลายแหล่ง', wiki:'ค้นข้อมูลจากหลายแหล่ง',
      weather:'ตรวจสภาพอากาศ', crypto:'เทียบราคาคริปโต', currency:'เทียบอัตราแลกเปลี่ยน',
      news:'ค้นข่าวล่าสุด', stock:'ดึงราคาหุ้นและข่าวสาร', browse:'อ่านหน้าเว็บ',
      hackernews:'ดึงข่าวไอที', country:'ค้นข้อมูลประเทศ', ip_lookup:'ตรวจสอบ IP' };

    window.onload = function() {
      document.getElementById('side-logo').innerHTML = logoSVG('sm');
      marked.setOptions({ breaks:true, gfm:true, highlight:(c,l) => {
        try { return (l && hljs.getLanguage(l)) ? hljs.highlight(c,{language:l}).value : hljs.highlightAuto(c).value; }
        catch(e){ return c; } } });
      loadSessions(); loadModel();
      document.addEventListener('click', e => {
        if (!e.target.closest('.pop') && !e.target.closest('.pill') && !e.target.closest('.cbtn')) closePops();
      });
    };

    function toggleSide(){ document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('backdrop').classList.toggle('open'); }
    function closeSide(){ document.getElementById('sidebar').classList.remove('open');
      document.getElementById('backdrop').classList.remove('open'); }
    function closeSideMobile(){ if (window.innerWidth <= 820) closeSide(); }

    /* ═══ POPUP ═══ */
    function closePops() { document.querySelectorAll('.pop').forEach(p => p.classList.remove('open')); }

    function togglePop(id, anchor) {
      const p = document.getElementById(id);
      const wasOpen = p.classList.contains('open');
      closePops();
      if (wasOpen) return;

      const wrap = document.querySelector('.composer-wrap');
      const wr = wrap.getBoundingClientRect();
      const ar = anchor.getBoundingClientRect();

      p.classList.add('open');
      const pw = p.offsetWidth;
      let left = ar.left - wr.left;
      if (left + pw > wr.width - 8) left = wr.width - pw - 8;
      if (left < 8) left = 8;
      p.style.left = left + 'px';
      p.style.bottom = (wr.bottom - ar.top + 8) + 'px';
    }

    /* ═══ SESSIONS ═══ */
    function loadSessions() {
      google.script.run.withSuccessHandler(db => {
        sessions = db || [];
        if (!sessions.length) newChat();
        else { curId = sessions[0].id; renderList(); openChat(); }
      }).withFailureHandler(e => { console.error(e); newChat(); }).getUserSessions();
    }

    function newChat() {
      google.script.run.withSuccessHandler(s => {
        sessions.unshift(s); curId = s.id; deepMode = false; syncPill();
        renderList(); openChat(); closeSideMobile();
        document.getElementById('input').focus();
      }).withFailureHandler(e => alert("สร้างแชทใหม่ไม่ได้: " + e)).createUserSession("แชทใหม่");
    }

    function pick(id) { closeSideMobile(); if (curId === id) return; curId = id; renderList(); openChat(); }

    function delChat(e, id) {
      e.stopPropagation();
      if (!confirm('ลบการสนทนานี้?')) return;
      google.script.run.withSuccessHandler(() => {
        sessions = sessions.filter(s => s.id !== id);
        if (!sessions.length) newChat();
        else { if (curId === id) curId = sessions[0].id; renderList(); openChat(); }
      }).withFailureHandler(e2 => alert("ลบไม่สำเร็จ: " + e2)).deleteUserSession(id);
    }

    function clearAll() {
      if (!confirm('ลบการสนทนาทั้งหมด?')) return;
      let n = 0; const total = sessions.length;
      sessions.forEach(s => google.script.run.withSuccessHandler(() => {
        if (++n === total) { sessions = []; newChat(); } }).deleteUserSession(s.id));
    }

    function cur() { return sessions.find(s => s.id === curId); }

    function renderList() {
      const el = document.getElementById('list');
      const q = (document.getElementById('q').value || '').toLowerCase().trim();
      el.innerHTML = '';
      sessions.filter(s => !q || (s.title||'').toLowerCase().includes(q)).forEach(s => {
        const d = document.createElement('div');
        d.className = 'chat-item' + (s.id === curId ? ' active' : '');
        d.onclick = () => pick(s.id);
        d.innerHTML = `<span class="t">${esc(s.title || 'แชทใหม่')}</span>
          <i class="fa-solid fa-xmark del" onclick="delChat(event,'${s.id}')"></i>`;
        el.appendChild(d);
      });
    }

    function openChat() {
      const t = document.getElementById('thread');
      t.innerHTML = '';
      if (!curId) return;
      const s = cur();
      document.getElementById('topbar-title').textContent = (s && s.title) || 'Ceres';
      deepMode = !!(s && s.deepThinking);
      syncPill();

      google.script.run.withSuccessHandler(msgs => {
        if (!s) return;
        s.messages = msgs || [];
        if (!s.messages.length) { showEmpty(); return; }
        s.messages.forEach(m => {
          if (m.role === 'user') addUser(m.content);
          else addAI(m.thinking, m.content, m.source || null, false);
        });
        scrollDown();
      }).withFailureHandler(e => console.error(e)).getChatMessages(curId);
    }

    function showEmpty() {
      document.getElementById('thread').innerHTML = `
        <div class="empty">${logoSVG('')}
          <h1>สวัสดีค่ะ</h1>
          <p>ถามอะไรก็ได้ หรือเลือกโหมด “คิดลึก” จากปุ่มด้านล่าง เมื่ออยากให้ Ceres วิเคราะห์โจทย์ก่อนลงมือตอบ</p>
        </div>`;
    }

    /* ═══ MODEL ═══ */
    function shortName(m) {
      let s = String(m).split('/').pop();
      s = s.replace(/-(instruct|it|chat)$/i, '');
      return s.length > 22 ? s.substring(0,21) + '…' : s;
    }

    function loadModel() {
      setConn('loading', 'เชื่อมต่อ');
      google.script.run.withSuccessHandler(r => {
        if (r.success && r.models && r.models.length) {
          models = r.models;
          if (!model || models.indexOf(model) === -1) model = models[0];
          setConn('ready','พร้อม');
        } else { models = []; model = ""; setConn('error','ไม่พบโมเดล'); }
        renderModelList(); syncPill();
      }).withFailureHandler(() => { setConn('error','ขัดข้อง'); syncPill(); }).getAvailableModels();
    }

    function renderModelList() {
      const el = document.getElementById('model-list');
      if (!models.length) {
        el.innerHTML = `<div style="padding:9px 12px;font-size:13px;color:var(--text-muted)">ไม่พบโมเดล — เปิด LM Studio แล้วกด “เชื่อมต่อโมเดลใหม่”</div>`;
        return;
      }
      el.innerHTML = models.map(m => `
        <button class="pop-item ${m===model?'sel':''}" onclick="setModel('${esc(m)}')">
          <span class="pi-ic"><i class="fa-solid fa-microchip"></i></span>
          <span class="pi-tx"><span class="pi-t">${esc(shortName(m))}</span>
            <span class="pi-d">${esc(m)}</span></span>
          <span class="pi-ck"><i class="fa-solid fa-check"></i></span>
        </button>`).join('');
    }

    function setModel(m) { model = m; renderModelList(); syncPill(); closePops(); }

    function setDeep(v) {
      deepMode = v; syncPill(); closePops();
      const s = cur(); if (s) s.deepThinking = v;
      if (curId) google.script.run.withFailureHandler(()=>{}).updateSessionMode(curId, v);
    }

    function syncPill() {
      const pill = document.getElementById('pill');
      const lbl = document.getElementById('pill-lbl');
      lbl.textContent = model ? (shortName(model) + (deepMode ? ' · คิดลึก' : '')) : 'ยังไม่มีโมเดล';
      pill.classList.toggle('deep', deepMode);
      document.getElementById('mode-fast').classList.toggle('sel', !deepMode);
      document.getElementById('mode-deep').classList.toggle('sel', deepMode);
    }

    function setConn(type, txt) {
      const c = document.getElementById('conn');
      c.className = 'conn ' + type;
      c.innerHTML = `<span class="dot"></span><span class="txt">${esc(txt)}</span>`;
    }

    function autoGrow(el) { el.style.height='auto'; el.style.height = Math.min(el.scrollHeight,190)+'px'; }
    function onKey(e) {
      const mobile = window.innerWidth <= 820;
      if (e.key === 'Enter' && !e.shiftKey && !mobile) { e.preventDefault(); send(); }
    }

    /* ═══ MIC (Web Speech API) ═══ */
    let recog = null, recording = false;
    function toggleMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง ลองใช้ Chrome นะคะ"); return; }
      const btn = document.getElementById('mic');
      if (recording) { if (recog) recog.stop(); return; }

      recog = new SR();
      recog.lang = 'th-TH'; recog.interimResults = true; recog.continuous = false;
      const inp = document.getElementById('input');
      const base = inp.value;

      recog.onstart = () => { recording = true; btn.classList.add('rec'); };
      recog.onresult = e => {
        let txt = '';
        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
        inp.value = (base ? base + ' ' : '') + txt;
        autoGrow(inp);
      };
      recog.onerror = () => { recording = false; btn.classList.remove('rec'); };
      recog.onend = () => { recording = false; btn.classList.remove('rec'); inp.focus(); };
      recog.start();
    }

    /* ═══ LIVE ═══ */
    function addLive() {
      const id = 'lv-' + Date.now();
      const t = document.getElementById('thread');
      const d = document.createElement('div');
      d.className = 'row'; d.id = id;
      d.innerHTML = `<div class="live">${logoSVG('busy')}<span class="live-txt" id="${id}-t">กำลังทำความเข้าใจ</span></div>`;
      t.appendChild(d); scrollDown();
      return { id, steps: [] };
    }
    function setLive(h, txt) {
      if (!h) return;
      const el = document.getElementById(h.id + '-t');
      if (!el || el.textContent === txt) return;
      el.classList.add('fade');
      setTimeout(() => { el.textContent = txt; el.classList.remove('fade'); }, 190);
    }
    function liveSteps(h, list) {
      const el = document.getElementById(h.id);
      if (!el) return;
      h.steps = list;
      el.innerHTML = `<div class="steps" id="${h.id}-s"></div>
        <div class="live">${logoSVG('busy')}<span class="live-txt" id="${h.id}-t">เริ่มต้น</span></div>`;
      renderSteps(h, -1);
    }
    function renderSteps(h, active) {
      const box = document.getElementById(h.id + '-s');
      if (!box) return;
      box.innerHTML = h.steps.map((s,i) => {
        const cls = i < active ? 'done' : (i === active ? 'active' : '');
        const ico = i < active ? '<i class="fa-solid fa-check"></i>'
                  : i === active ? '<i class="fa-solid fa-circle-notch fa-spin"></i>'
                  : '<i class="fa-regular fa-circle" style="opacity:.35"></i>';
        return `<div class="step ${cls}"><span class="ico">${ico}</span><span>${esc(s)}</span></div>`;
      }).join('');
      scrollDown();
    }
    function stepTo(h, i, txt) { renderSteps(h, i); if (txt) setLive(h, txt); }
    function rmLive(h) { if (!h) return; const el = document.getElementById(h.id); if (el) el.remove(); }

    /* ═══ SEND ═══ */
    function send() {
      const inp = document.getElementById('input');
      const text = inp.value.trim();
      if (!text || busy) return;
      if (!model) { alert("ยังไม่ได้เชื่อมต่อโมเดล เปิด LM Studio แล้วกดปุ่ม + → เชื่อมต่อโมเดลใหม่"); return; }
      closePops();

      const s = cur();
      if (s && (s.title === 'แชทใหม่' || !s.title)) {
        const nt = text.length > 28 ? text.substring(0,28) + '…' : text;
        s.title = nt; renderList();
        document.getElementById('topbar-title').textContent = nt;
        google.script.run.updateSessionTitle(s.id, nt);
      }

      const em = document.querySelector('.empty'); if (em) em.remove();
      addUser(text);
      google.script.run.saveChatMessage(curId, 'user', text, '', '');
      inp.value = ''; autoGrow(inp);
      run(text);
    }

    function run(text) {
      busy = true;
      document.getElementById('send').disabled = true;
      const h = addLive();
      google.script.run
        .withSuccessHandler(plan => {
          if (!plan || plan.tool === 'none') { afterTool(text, h, null); return; }
          setLive(h, STEP[plan.tool] || 'ดึงข้อมูล');
          google.script.run
            .withSuccessHandler(tr => afterTool(text, h, tr && tr.success ? tr : null))
            .withFailureHandler(() => afterTool(text, h, null))
            .fetchToolData(plan.tool, plan.params);
        })
        .withFailureHandler(() => afterTool(text, h, null))
        .planToolUse(text, model);
    }

    function afterTool(text, h, tool) { deepMode ? runDeep(text,h,tool) : runNormal(text,h,tool); }

    function runNormal(text, h, tool) {
      setLive(h, 'กำลังเรียบเรียงคำตอบ');
      const ok = res => finish(res, h, tool ? tool.source : null, tool);
      const fail = err => { rmLive(h); unbusy(); addAI('','เชื่อมต่อไม่สำเร็จ: '+err,null,false); };
      if (tool) google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
        .sendMessageToAIWithTool(curId, text, model, tool, {});
      else google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
        .sendMessageToAI(curId, text, model, {});
    }

    function runDeep(text, h, tool) {
      liveSteps(h, ['ทำความเข้าใจโจทย์', 'ร่างคำตอบตามแผน', 'ตรวจทานและปรับปรุง']);
      stepTo(h, 0, 'ตอบคำถามเกี่ยวกับโจทย์ก่อนลงมือ');

      google.script.run.withSuccessHandler(a => {
        if (!a || !a.success) { rmLive(h); unbusy(); addAI('','วิเคราะห์โจทย์ไม่สำเร็จ',null,false); return; }
        stepTo(h, 1, 'ลงมือเขียนคำตอบ');

        google.script.run.withSuccessHandler(d => {
          if (!d || !d.success) { rmLive(h); unbusy(); addAI('','ร่างคำตอบไม่สำเร็จ',null,false); return; }
          stepTo(h, 2, 'ตรวจหาจุดผิดพลาดและปรับปรุง');

          google.script.run.withSuccessHandler(f => {
            if (!f || !f.success) { rmLive(h); unbusy(); addAI('','ตรวจทานไม่สำเร็จ',null,false); return; }
            const think = '◆ ทำความเข้าใจโจทย์\n' + a.plan +
              (d.draftThinking ? '\n\n◆ ระหว่างร่าง\n' + d.draftThinking : '') +
              '\n\n◆ ตรวจทาน\nตรวจสอบร่างกับแผนที่วางไว้ แก้จุดที่ตกหล่นแล้วเรียบเรียงใหม่';
            finish({ success:true, reply:f.reply, thinking:think }, h, tool ? tool.source : null, tool);
          }).withFailureHandler(e => { rmLive(h); unbusy(); addAI('','ตรวจทานล้มเหลว: '+e,null,false); })
            .deepThinkRefine(curId, text, a.plan, d.draft, a.carry, model);

        }).withFailureHandler(e => { rmLive(h); unbusy(); addAI('','ร่างคำตอบล้มเหลว: '+e,null,false); })
          .deepThinkDraft(curId, text, a.plan, a.carry, model, tool);

      }).withFailureHandler(e => { rmLive(h); unbusy(); addAI('','วิเคราะห์ล้มเหลว: '+e,null,false); })
        .deepThinkAnalyze(curId, text, model, tool);
    }

    function unbusy() { busy = false; document.getElementById('send').disabled = false; }

    function finish(res, h, src, tool) {
      rmLive(h); unbusy();
      if (res.success) {
        google.script.run.saveChatMessage(curId, 'assistant', res.reply, res.thinking, src || "");
        const s = cur();
        if (s && s.messages) s.messages.push({ role:'assistant', thinking:res.thinking,
          content:res.reply, source:src });
        addAI(res.thinking, res.reply, src, true, res.cached, tool);
      } else addAI('', res.reply, null, false);
    }

    /* ═══ RENDER ═══ */
    function addUser(text) {
      const t = document.getElementById('thread');
      const d = document.createElement('div');
      d.className = 'row user';
      d.innerHTML = `<div class="bubble-user">${esc(text)}</div>`;
      t.appendChild(d); scrollDown();
    }

    function thinkHTML(th) {
      if (!th) return '';
      const body = th.split(/◆\s*/).filter(Boolean).map(c => {
        const nl = c.indexOf('\n');
        if (nl === -1) return esc(c);
        return `<span class="think-stage">${esc(c.substring(0,nl).trim())}</span>${esc(c.substring(nl+1).trim())}`;
      }).join('\n\n');
      return `<details class="think">
        <summary><i class="fa-solid fa-chevron-right chev"></i> กระบวนการคิด</summary>
        <div class="think-body">${body}</div></details>`;
    }

    function tagsHTML(src, cached, tool) {
      let h = '';
      if (tool && tool.verifyLevel && tool.sourceCount > 1) {
        const lv = tool.verifyLevel;
        const ic = lv==='high'?'fa-circle-check':lv==='medium'?'fa-circle-half-stroke':
                   lv==='low'?'fa-triangle-exclamation':'fa-circle-info';
        h += `<span class="tag v-${esc(lv)}"><i class="fa-solid ${ic}"></i>${esc(tool.verifyLabel||'')}</span>`;
      }
      if (tool && tool.usedPremium) h += `<span class="tag prem"><i class="fa-solid fa-star"></i>แหล่งแม่นยำสูง</span>`;
      if (src) src.split(' + ').forEach(s => h += `<span class="tag src">${esc(s.trim())}</span>`);
      if (cached) h += `<span class="tag cache"><i class="fa-solid fa-bolt"></i>แคช</span>`;
      return h;
    }

    function addAI(thinking, text, src, stream, cached, tool) {
      const t = document.getElementById('thread');
      const d = document.createElement('div');
      d.className = 'row';
      const id = 'm' + Date.now() + Math.floor(Math.random()*999);
      d.innerHTML = `${thinkHTML(thinking)}
        <div class="msg-ai" id="${id}" data-raw="${encodeURIComponent(text)}"></div>
        <div class="meta" id="mt-${id}"></div>`;
      t.appendChild(d);

      const body = document.getElementById(id), meta = document.getElementById('mt-'+id);
      const done = () => {
        body.innerHTML = md(text);
        if (window.hljs) d.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        meta.innerHTML = `<button class="act" onclick="copyM('${id}')"><i class="fa-regular fa-copy"></i>คัดลอก</button>
          <button class="act" onclick="regen()"><i class="fa-solid fa-rotate-right"></i>ลองใหม่</button>`
          + tagsHTML(src, cached, tool);
        scrollDown();
      };

      if (!stream) { done(); return; }
      let i = 0; const stp = cached ? 7 : 2;
      const tm = setInterval(() => {
        i += stp;
        if (i >= text.length) { clearInterval(tm); done(); return; }
        body.innerHTML = md(text.substring(0,i)) + '<span class="cursor"></span>';
        scrollDown();
      }, 14);
    }

    function regen() {
      const s = cur();
      if (!model || busy) return;
      let last = null;
      if (s && s.messages) for (let i = s.messages.length-1; i >= 0; i--)
        if (s.messages[i].role === 'user') { last = s.messages[i].content; break; }
      if (!last) return;
      google.script.run.withSuccessHandler(() => { openChat(); setTimeout(() => run(last), 350); })
        .withFailureHandler(e => alert("ลบคำตอบเดิมไม่สำเร็จ: " + e))
        .deleteLastAssistantMessage(curId);
    }

    /* ═══ QUOTA ═══ */
    function openQuota() {
      document.getElementById('quota-modal').classList.add('open');
      closeSideMobile();
      const b = document.getElementById('quota-body');
      b.innerHTML = '<div style="text-align:center;padding:28px;color:var(--text-muted);font-size:13.5px;">กำลังโหลด</div>';
      google.script.run.withSuccessHandler(r => {
        if (!r || !r.apis) { b.innerHTML = '<div style="padding:20px;color:var(--danger)">โหลดไม่สำเร็จ</div>'; return; }
        const free = r.apis.filter(a => a.tier==='free'), prem = r.apis.filter(a => a.tier==='premium');
        let h = `<div style="font-size:12px;color:var(--text-muted);line-height:1.55;">
          รอบเดือน ${esc(r.month)} · ตัวนับบันทึกลง Firestore ทุกครั้งที่เรียกใช้จริง</div>`;
        h += `<div class="tier-h free"><i class="fa-solid fa-infinity"></i> แหล่งฟรี</div>
              <div class="tier-d">ใช้เป็นแกนหลักทุกครั้ง ไม่ต้องกังวลเรื่องโควตา</div>`;
        free.forEach(a => h += qItem(a));
        h += `<div class="tier-h prem"><i class="fa-solid fa-star"></i> แหล่งแม่นยำสูง</div>
              <div class="tier-d">เรียกใช้เฉพาะตอนที่แหล่งฟรีหาข้อมูลไม่พอ หรือข้อมูลขัดแย้งกัน</div>`;
        prem.forEach(a => h += qItem(a));
        b.innerHTML = h;
      }).withFailureHandler(e => {
        b.innerHTML = '<div style="padding:20px;color:var(--danger);font-size:13px">โหลดไม่สำเร็จ: '+esc(String(e))+'</div>';
      }).getApiQuotaStatus();
    }

    function qItem(a) {
      const off = (a.needsKey && !a.keyConfigured) || a.exhausted;
      const fill = (a.tier==='premium'?'prem ':'') + (a.percent>=100?'full':a.percent>=80?'warn':'');
      let st;
      if (a.needsKey && !a.keyConfigured) st = '<span class="q-nokey">ยังไม่ได้ใส่ Key</span>';
      else if (a.exhausted) st = '<span style="color:var(--danger);font-weight:600">โควตาเต็ม</span>';
      else if (a.unlimited) st = `ใช้แล้ว ${a.used} · ไม่จำกัด`;
      else { st = `${a.used} / ${a.limit}`;
      if (a.providerRemaining != null) st += ` <span class="q-real">· เหลือจริง ${a.providerRemaining}</span>`; }
      let h = `<div class="q-item ${off?'off':''}">
        <div class="q-top"><span class="q-name">${esc(a.label)}</span><span class="q-cnt">${st}</span></div>`;
      if (!a.unlimited) h += `<div class="q-bar"><div class="q-fill ${fill}" style="width:${a.percent}%"></div></div>`;
      h += `<div class="q-note">${esc(a.note)}</div>`;
      if (a.needsKey && !a.keyConfigured && a.keyProp)
        h += `<div class="q-setup">${esc(a.keyProp)}${a.signup ? ' · ' + esc(a.signup) : ''}</div>`;
      return h + `</div>`;
    }

    function closeQuota(){ document.getElementById('quota-modal').classList.remove('open'); }

    function md(t){ try { return marked.parse(t||''); } catch(e){ return esc(t||'').replace(/\n/g,'<br>'); } }
    function scrollDown(){ const s = document.getElementById('scroll'); s.scrollTop = s.scrollHeight; }
    function esc(t){ return String(t==null?'':t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    function copyM(id) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(decodeURIComponent(el.getAttribute('data-raw')||'')).then(() => {
        const b = document.getElementById('mt-'+id).querySelector('.act');
        if (b) { const o = b.innerHTML; b.innerHTML = '<i class="fa-solid fa-check"></i>คัดลอกแล้ว';
          setTimeout(() => b.innerHTML = o, 1400); }
      });
    }
  </script>
</body>
</html>
